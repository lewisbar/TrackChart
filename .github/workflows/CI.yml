# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CI

on:
  pull_request:
    branches: [ "develop", "release" ]

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Disable hardened runtime (required for test-without-building on macOS)
      run: |
        perl -i -pe 's/ENABLE_HARDENED_RUNTIME\s*=\s*YES.*/ENABLE_HARDENED_RUNTIME = NO;/g' \
          TrackChart.xcodeproj/project.pbxproj

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData/TrackChart-*
        key: deriveddata-macos26-${{ hashFiles('TrackChart.xcodeproj/project.pbxproj') }}-${{ hashFiles('**/*.swift') }}

    - name: Build macOS
      run: |
        xcodebuild build \
          -project TrackChart.xcodeproj \
          -scheme CI_macOS \
          -destination 'platform=macOS,arch=arm64' \
          CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES

    - name: Test macOS
      run: |
        xcodebuild test-without-building \
          -project TrackChart.xcodeproj \
          -scheme CI_macOS \
          -testPlan CI_macOS \
          -destination 'platform=macOS,arch=arm64' \
          CODE_SIGNING_REQUIRED=NO | xcbeautify --quiet --is-ci
