# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CI

on:
  pull_request:
    branches: [ "develop", "release" ]

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Cache DerivedData (only this project)
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData/TrackChart-*
        key: deriveddata-macos26-${{ hashFiles('TrackChart.xcodeproj/project.pbxproj') }}-${{ hashFiles('**/*.swift') }}
        restore-keys: |
          deriveddata-macos26-

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_26.0.1.app

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    - name: Build macOS target
      run: |
        xcodebuild build \
          -project TrackChart.xcodeproj \
          -scheme CI_macOS \
          -sdk macosx \
          -destination 'platform=macOS,arch=arm64' \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=YES | xcbeautify --quiet --is-ci

    - name: Test macOS target
      run: |
        xcodebuild test-without-building \
          -project TrackChart.xcodeproj \
          -scheme CI_macOS \
          -testPlan CI_macOS \
          -destination 'platform=macOS,arch=arm64' \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=YES | xcbeautify --quiet --is-ci
